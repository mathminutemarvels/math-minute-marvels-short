# ==============================================================================
# PART 1 OF 3: TRIGGERS, SCHEDULES, MANUAL INPUTS & REPO PERMISSIONS
# ==============================================================================
name: MathMinuteMarvels Unified Pipeline

on:
  schedule:
    # 4 Daily Shorts (triggers 1 hr before 02:00, 08:00, 14:00, 20:00 IST)
    - cron: "30 19 * * *"
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
    # 2 Weekly Long Videos (triggers Wed & Sat at 18:00 IST -> publishes 19:00 IST)
    - cron: "30 12 * * 3,6"
    # 1 Weekly Analytics Review (triggers Sunday at 09:00 IST)
    - cron: "30 3 * * 0"

  workflow_dispatch:
    inputs:
      task:
        description: "Pipeline task to run"
        required: true
        default: "short"
        type: choice
        options:
          - short
          - long
          - review
      test_mode:
        description: "Dry run (render MP4 artifact without uploading to YouTube)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# ==============================================================================
# PART 2 OF 3: RUNNER SETUP, DEPENDENCIES & AUTOMATIC CRON-TO-TASK ROUTER
# ==============================================================================
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine active task (short, long, or review)
        id: route
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 12 * * 3,6" ]; then
            echo "task=long" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 3 * * 0" ]; then
            echo "task=review" >> $GITHUB_OUTPUT
          else
            echo "task=short" >> $GITHUB_OUTPUT
          fi

      # ========================================================================
      # PART 3A OF 3: EXECUTE ACTIVE TASK WITH LIVE UNBUFFERED LOGS
      # ========================================================================
      - name: Execute pipeline task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          TASK="${{ steps.route.outputs.task }}"
          echo "Running task: $TASK (test_mode=${{ inputs.test_mode }})"

          if [ "$TASK" = "review" ]; then
            python -u weekly_review.py
          elif [ "${{ inputs.test_mode }}" = "true" ]; then
            python -u main.py --mode "$TASK" --test
          else
            python -u main.py --mode "$TASK"
          fi

      # ========================================================================
      # PART 3B OF 3: UPLOAD TEST VIDEO ARTIFACT IN DRY-RUN MODE
      # ========================================================================
      - name: Upload test video artifact
        if: ${{ inputs.test_mode == true && steps.route.outputs.task != 'review' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ steps.route.outputs.task }}-video
          path: ${{ steps.route.outputs.task == 'short' && 'short.mp4' || 'long_video.mp4' }}
          retention-days: 3

      - name: Save updated JSON records
        if: ${{ inputs.test_mode != true }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f history.json weekly_insights.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update pipeline records"
            git pull --rebase origin main
            git push origin main
          fi
