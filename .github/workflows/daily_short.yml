name: Daily Math Short
on:
  schedule:
    # Runs 6 times a day (every 4 hours):
    # 6:30 PM, 10:30 PM, 2:30 AM, 6:30 AM, 10:30 AM, and 2:30 PM IST
    - cron: '0 13,17,21,1,5,9 * * *'
  workflow_dispatch: # Allows manual test runs anytime

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py
      - name: Save question history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add history.json
          git commit -m "Update question history" || exit 0
          git pull --rebase origin main
          git push origin main
