name: Daily Math Short
on:
  schedule:
    # Mon, Tue, Thu, Fri, Sat: 6 Shorts/day (6:30 PM, 10:30 PM, 2:30 AM, 6:30 AM, 10:30 AM, 2:30 PM IST)
    - cron: '0 13,17,21,1,5,9 * * 1,2,4,5,6'
    # Wed & Sun: 5 Shorts/day (skips 6:30 PM IST slot so Weekly Long Video uses that API quota)
    - cron: '0 17,21,1,5,9 * * 0,3'
  workflow_dispatch: # Allows manual test runs anytime

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py
