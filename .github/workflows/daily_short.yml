name: Daily Math Short
on:
  schedule:
    - cron: '0 13,17,21,1,5,9 * * *' # Runs automatically every day at 6:30 PM IST
  workflow_dispatch:      # Adds a manual "Run workflow" button for testing

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py
