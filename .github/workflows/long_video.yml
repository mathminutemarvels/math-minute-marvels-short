name: Weekly Long Math Video
on:
  schedule:
    # Wednesday at 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * 3'
    # Sunday at 11:00 AM IST (05:30 UTC)
    - cron: '30 5 * * 0'
  workflow_dispatch: # Allows manual test runs anytime

jobs:
  build-and-upload-long:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python make_long_video.py
      - name: Save question history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add history.json
          git commit -m "Update question history" || exit 0
          git pull --rebase origin main
          git push origin main
