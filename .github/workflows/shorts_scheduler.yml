name: Daily Shorts Scheduler (4x Daily)

on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Dry run (render short.mp4 artifact without uploading to YouTube)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and Schedule Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            python main.py --mode short --test
          else
            python main.py --mode short
          fi

      - name: Upload Test Video Artifact
        if: ${{ inputs.test_mode == true }}
        uses: actions/upload-artifact@v4
        with:
          name: test-short-video
          path: short.mp4
          retention-days: 3

      - name: Commit updated history.json
        if: ${{ inputs.test_mode != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: log scheduled Short to history.json"
            git pull --rebase origin main
            git push origin main
          fi
